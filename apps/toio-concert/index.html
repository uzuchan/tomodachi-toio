<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toioコンサート</title>
<style>
  :root { --bg:#FDF6EC; --ink:#4A3F35; --accent:#8B6FD8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; background:var(--bg);
         color:var(--ink); max-width:640px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:24px; margin-bottom:4px; }
  .sub { color:#9A8C7E; font-size:13px; margin-bottom:18px; }
  .sub a { color:#59A1E8; }
  .card { background:#fff; border-radius:18px; padding:18px 20px; margin-bottom:14px;
          box-shadow:0 4px 16px rgba(74,63,53,.08); }
  .btn { border:none; border-radius:999px; padding:12px 20px; font-size:15px; font-family:inherit;
         cursor:pointer; color:#fff; background:var(--accent); box-shadow:0 2px 0 rgba(0,0,0,.12); }
  .btn:active { transform:translateY(2px); box-shadow:none; }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.mini { padding:8px 14px; font-size:13px; background:#C9BBAA; }
  .idbox { width:56px; font-family:Menlo,monospace; font-size:15px; text-align:center;
           border:2px solid #E8D9C0; border-radius:8px; padding:8px 4px; }
  .row { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .role { font-size:13px; color:#9A8C7E; }
  .song { display:flex; align-items:center; gap:12px; width:100%; text-align:left;
          background:#F8F1E4; border:none; border-radius:14px; padding:14px 16px; margin-bottom:10px;
          font-family:inherit; font-size:15px; cursor:pointer; color:var(--ink); transition:background .12s; }
  .song:hover { background:#F1E5D0; }
  .song.playing { background:#EDE4FB; outline:2px solid var(--accent); }
  .song .emoji { font-size:24px; }
  .song small { display:block; color:#9A8C7E; font-size:12px; margin-top:2px; }
  .song:disabled { opacity:.45; cursor:default; }
  label { font-size:14px; user-select:none; }
  #status { font-size:13px; color:#9A8C7E; min-height:20px; margin-top:8px; }
  #stage { text-align:center; font-size:64px; height:80px; line-height:80px; }
  .spin { display:inline-block; animation:spin 1.2s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <h1>🎻 toioコンサート</h1>
  <p class="sub">1台でオーケストラ、2台そろえばデュエット。演奏に合わせてダンスもするよ ｜ <a href="../../index.html">← ホームへ</a></p>

  <div class="card">
    <div class="row">
      <span>🎤①</span>
      <input id="cube-id0" class="idbox" value="954" title="キューブID（空で全toio表示）">
      <button id="btn-connect0" class="btn">つなぐ</button>
      <span class="role">めろでぃ担当</span>
    </div>
    <div class="row">
      <span>🎸②</span>
      <input id="cube-id1" class="idbox" value="h4i" title="キューブID（空で全toio表示）">
      <button id="btn-connect1" class="btn">つなぐ</button>
      <span class="role">ばんそう担当（2台の曲で使うよ）</span>
    </div>
    <label><input type="checkbox" id="chk-dance" checked> ダンスする（机の広い所で！）</label>
    <div id="status">未接続。IDで絞り込めます（空欄=すべて表示）</div>
  </div>

  <div class="card">
    <div id="stage">🤖</div>
    <div id="songs"></div>
    <button id="btn-stop" class="btn mini" disabled>■ 停止</button>
  </div>

<script src="toio.js"></script>
<script>
const $ = id => document.getElementById(id);
const cubes = [null, null];   // [0]=めろでぃ担当, [1]=ばんそう担当
let playToken = 0;
const active = () => cubes.filter(Boolean);

// ── 音名 → MIDIノート番号 ────────────────────────────────────
const N = (() => {
  const base = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  const map = {};
  for (let oct = 3; oct <= 6; oct++) for (const [k, v] of Object.entries(base)) {
    map[`${k}${oct}`]  = 12 * (oct + 1) + v;
    map[`${k}#${oct}`] = 12 * (oct + 1) + v + 1;
    map[`${k}b${oct}`] = 12 * (oct + 1) + v - 1;
  }
  map.R = 128;  // 休符
  return map;
})();

// ── 曲データ: [音名, 拍数] / tempo=BPM / repeat=繰り返し ──────
// duet曲は sections = [{m: ①メロディ, b: ②伴奏}, ...]。
// 各セクションは両パート同じ拍数にすること（境界で2台を再同期するため）。
const SONGS = [
  {
    id: 'atsumori', emoji: '🏝️', name: 'あつまれ どうぶつの森 メインテーマ',
    desc: '①くちぶえメロディ ＋ ②ベース&ウクレレ（耳コピ風アレンジ）', tempo: 104, repeat: 1,
    duet: true,
    sections: [
      { // Aセクション 8小節 | C | Am | F | G | C | Am | Dm7 G7 | C |
        m: [
          ['G4',.5],['A4',.5],['C5',1.5],['D5',.5],['E5',1],
          ['G5',.67],['E5',.33],['D5',1],['C5',1],['A4',1],
          ['G4',.5],['A4',.5],['C5',1.5],['D5',.5],['E5',1],
          ['D5',.67],['C5',.33],['A4',1],['G4',2],
          ['E5',.5],['F5',.5],['G5',1.5],['F5',.5],['E5',1],
          ['A5',.67],['G5',.33],['E5',1],['C5',1],['D5',1],
          ['E5',.5],['D5',.5],['C5',1],['A4',.67],['G4',.33],['A4',1],
          ['C5',3],['R',1],
        ],
        b: [
          ['C3',1],['G3',1],['E4',.5],['R',.5],['G3',1],
          ['A3',1],['E3',1],['C4',.5],['R',.5],['E3',1],
          ['F3',1],['C4',1],['A3',.5],['R',.5],['C4',1],
          ['G3',1],['D4',1],['B3',.5],['R',.5],['D4',1],
          ['C3',1],['G3',1],['E4',.5],['R',.5],['G3',1],
          ['A3',1],['E3',1],['C4',.5],['R',.5],['E3',1],
          ['D3',1],['A3',1],['G3',1],['B3',1],
          ['C3',1],['G3',1],['C4',1],['R',1],
        ],
      },
      { // Bセクション 8小節 | C | Am | F | G7 | C | Am | F G7 | C |
        m: [
          ['E5',.5],['E5',.5],['E5',1],['D5',.5],['C5',.5],['D5',1],
          ['E5',.67],['D5',.33],['C5',1],['A4',2],
          ['F5',.5],['F5',.5],['F5',1],['E5',.5],['D5',.5],['E5',1],
          ['F5',.67],['E5',.33],['D5',1],['G5',2],
          ['G4',.5],['A4',.5],['C5',1.5],['D5',.5],['E5',1],
          ['G5',.67],['E5',.33],['D5',1],['C5',1],['A4',1],
          ['G4',.5],['A4',.5],['C5',1],['D5',.67],['E5',.33],['D5',1],
          ['C5',3],['R',1],
        ],
        b: [
          ['C3',1],['G3',1],['E4',.5],['R',.5],['G3',1],
          ['A3',1],['E3',1],['C4',.5],['R',.5],['E3',1],
          ['F3',1],['C4',1],['A3',.5],['R',.5],['C4',1],
          ['G3',1],['D4',1],['B3',.5],['R',.5],['F4',1],
          ['C3',1],['G3',1],['E4',.5],['R',.5],['G3',1],
          ['A3',1],['E3',1],['C4',.5],['R',.5],['E3',1],
          ['F3',1],['A3',1],['G3',1],['B3',1],
          ['C3',1],['G3',1],['C4',2],
        ],
      },
    ],
  },
  {
    id: 'eine', emoji: '🎻', name: 'アイネ・クライネ・ナハトムジーク',
    desc: 'モーツァルト K.525 — 冒頭の名フレーズ', tempo: 132, repeat: 2,
    notes: [
      // m1
      ['G4',1],['R',.5],['D4',.5],['G4',1],['R',.5],['D4',.5],
      // m2
      ['G4',.5],['D4',.5],['G4',.5],['B4',.5],['D5',1],['R',1],
      // m3
      ['C5',1],['R',.5],['A4',.5],['C5',1],['R',.5],['A4',.5],
      // m4
      ['C5',.5],['A4',.5],['F#4',.5],['A4',.5],['D4',1],['R',1],
    ],
  },
  {
    id: 'twinkle', emoji: '⭐', name: 'きらきら星',
    desc: 'モーツァルトつながりで（変奏曲の主題）', tempo: 108, repeat: 1,
    notes: [
      ['C5',1],['C5',1],['G5',1],['G5',1],['A5',1],['A5',1],['G5',2],
      ['F5',1],['F5',1],['E5',1],['E5',1],['D5',1],['D5',1],['C5',2],
      ['G5',1],['G5',1],['F5',1],['F5',1],['E5',1],['E5',1],['D5',2],
      ['G5',1],['G5',1],['F5',1],['F5',1],['E5',1],['E5',1],['D5',2],
      ['C5',1],['C5',1],['G5',1],['G5',1],['A5',1],['A5',1],['G5',2],
      ['F5',1],['F5',1],['E5',1],['E5',1],['D5',1],['D5',1],['C5',2],
    ],
  },
  {
    id: 'frog', emoji: '🐸', name: 'かえるのうた',
    desc: 'アンコール用の小品', tempo: 120, repeat: 1,
    notes: [
      ['C5',1],['D5',1],['E5',1],['F5',1],['E5',1],['D5',1],['C5',1],['R',1],
      ['E5',1],['F5',1],['G5',1],['A5',1],['G5',1],['F5',1],['E5',1],['R',1],
      ['C5',1],['R',1],['C5',1],['R',1],['C5',1],['R',1],['C5',1],['R',1],
      ['C5',.5],['C5',.5],['D5',.5],['D5',.5],['E5',.5],['E5',.5],['F5',.5],['F5',.5],
      ['E5',1],['D5',1],['C5',1],['R',1],
    ],
  },
];

// ── UI 構築 ──────────────────────────────────────────────────
for (const s of SONGS) {
  const b = document.createElement('button');
  b.className = 'song'; b.id = `song-${s.id}`; b.disabled = true;
  const duetTag = s.duet ? ' ・ 🤖×2台' : '';
  b.innerHTML = `<span class="emoji">${s.emoji}</span>
    <span>${s.name}<small>${s.desc} ・ ${Math.round(songMs(s) / 1000)}秒${duetTag}</small></span>`;
  b.onclick = () => play(s);
  $('songs').appendChild(b);
}

function songMs(s) {
  const beat = 60000 / s.tempo;
  const sum = arr => arr.reduce((a, [, b]) => a + b * beat, 0);
  const once = s.duet ? s.sections.reduce((a, sec) => a + sum(sec.m), 0) : sum(s.notes);
  return once * s.repeat;
}

// ── 接続 ────────────────────────────────────────────────────
const MARU = ['①', '②'];

async function connect(slot) {
  try {
    $('status').textContent = `toio${MARU[slot]} 接続中…`;
    const c = await toioManager.addCube($(`cube-id${slot}`).value);
    cubes[slot] = c;
    $(`btn-connect${slot}`).textContent = `✓ ${c.name}`;
    c.on('disconnect', () => {
      cubes[slot] = null; playToken++;
      $(`btn-connect${slot}`).textContent = 'つなぐ';
      $('status').textContent = `toio${MARU[slot]} が切断されました。もう一度接続してください`;
      refreshButtons();
    });
    refreshButtons();
    $('status').textContent =
      cubes[0] && cubes[1] ? '✓ 2台そろった！デュエットもできるよ' :
      slot === 0 ? `✓ ${c.name} と接続中。2台の曲は②もつないでね` :
                   `✓ ${c.name} と接続中。①もつなぐと演奏できるよ`;
    await c.setLED(...(slot === 0 ? [140, 100, 255] : [255, 170, 60]), 0);
    await c.playSoundEffect(slot);
  } catch (e) {
    $('status').textContent = `接続できず: ${e.name}（電源・他タブの接続・IDを確認して再試行）`;
  }
}
$('btn-connect0').onclick = () => connect(0);
$('btn-connect1').onclick = () => connect(1);

function refreshButtons() {
  for (const s of SONGS)
    $(`song-${s.id}`).disabled = s.duet ? !(cubes[0] && cubes[1]) : !cubes[0];
  $('btn-stop').disabled = active().length === 0;
}

// ── 演奏 ────────────────────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function play(song) {
  if (song.duet ? !(cubes[0] && cubes[1]) : !cubes[0]) return;
  const token = ++playToken;
  document.querySelectorAll('.song').forEach(b => b.classList.remove('playing'));
  $(`song-${song.id}`).classList.add('playing');
  $('stage').innerHTML = song.duet
    ? '<span class="spin">🤖</span> 🎶 <span class="spin">🤖</span>'
    : '<span class="spin">🤖</span> 🎶';
  $('status').textContent = `♪ ${song.name} を演奏中…`;

  const beat = 60000 / song.tempo;
  const conv = arr => arr.map(([n, b]) => [b * beat, N[n]]);

  // 演奏はキューブ内部のタイマーで進む。ダンスとLEDはJS側で並走。
  if ($('chk-dance').checked) danceLoop(token, beat, songMs(song));
  else ledLoop(token, beat, songMs(song));

  if (song.duet) {
    // セクションごとに2台へ同時書き込み → 境界のたびに再同期するのでズレが溜まらない
    for (let r = 0; r < song.repeat && token === playToken; r++) {
      for (const sec of song.sections) {
        if (token !== playToken) break;
        await Promise.all([
          cubes[0] && cubes[0].playMelody(conv(sec.m), 1).catch(() => {}),
          cubes[1] && cubes[1].playMelody(conv(sec.b), 1).catch(() => {}),
        ]);
      }
    }
  } else {
    await cubes[0].playMelody(conv(song.notes), song.repeat).catch(() => {});
  }

  if (token !== playToken) return;   // 停止・別曲に切り替わった
  $(`song-${song.id}`).classList.remove('playing');
  $('stage').textContent = song.duet ? '🤖✨🤖' : '🤖✨';
  $('status').textContent = `♪ ${song.name} — おしまい！`;
  for (const c of active()) {
    try { await c.stop(); await c.setLED(140, 100, 255, 0); } catch (e) {}
  }
}

const BEAT_COLS = [[255,80,160],[80,180,255],[255,200,60],[120,255,140]];

async function danceLoop(token, beat, totalMs) {
  const t0 = performance.now();
  let i = 0;
  while (token === playToken && active().length && performance.now() - t0 < totalMs) {
    active().forEach((c, k) => {
      const [r, g, b] = BEAT_COLS[(i + k * 2) % 4];
      c.setLED(r, g, b, 0).catch(() => {});
      // その場スピン（左右交互）: l = -r なので位置はほぼ動かない。2台目は逆回転でミラー
      const dir = (i % 2 === 0 ? 1 : -1) * (k === 0 ? 1 : -1);
      const spd = i % 8 === 7 ? 60 : 32;          // 8拍目だけ大きくくるっ
      c.move(spd * dir, -spd * dir, 0).catch(() => {});
    });
    await sleep(beat);
    i++;
  }
  active().forEach(c => c.stop().catch(() => {}));
}

async function ledLoop(token, beat, totalMs) {
  const t0 = performance.now();
  let i = 0;
  while (token === playToken && active().length && performance.now() - t0 < totalMs) {
    active().forEach((c, k) => {
      const [r, g, b] = BEAT_COLS[(i + k * 2) % 4];
      c.setLED(r, g, b, 0).catch(() => {});
    });
    await sleep(beat);
    i++;
  }
}

$('btn-stop').onclick = async () => {
  playToken++;
  document.querySelectorAll('.song').forEach(b => b.classList.remove('playing'));
  $('stage').textContent = '🤖';
  $('status').textContent = '停止しました';
  for (const c of active()) { try { await c.stopSound(); await c.stop(); } catch (e) {} }
};
</script>
</body>
</html>
